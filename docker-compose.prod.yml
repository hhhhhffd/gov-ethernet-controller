services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${VKO_POSTGRES_DB:?set VKO_POSTGRES_DB}
      POSTGRES_USER: ${VKO_POSTGRES_USER:?set VKO_POSTGRES_USER}
      POSTGRES_PASSWORD: ${VKO_POSTGRES_PASSWORD:?set VKO_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${VKO_POSTGRES_PORT:-5433}:5432"
    volumes:
      - vko_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      VKO_ENV: ${VKO_ENV:-staging}
      VKO_AUTO_SEED: ${VKO_AUTO_SEED:-1}
      VKO_AUTH_MODE: ${VKO_AUTH_MODE:-password}
      VKO_BOOTSTRAP_ADMIN_USERNAME: ${VKO_BOOTSTRAP_ADMIN_USERNAME:-}
      VKO_BOOTSTRAP_ADMIN_PASSWORD: ${VKO_BOOTSTRAP_ADMIN_PASSWORD:-}
      VKO_SESSION_TTL_SECONDS: ${VKO_SESSION_TTL_SECONDS:-28800}
      VKO_MAX_BACKFILL_DAYS: ${VKO_MAX_BACKFILL_DAYS:-90}
      VKO_DB_POOL: ${VKO_DB_POOL:-1}
      VKO_DB_POOL_MIN: ${VKO_DB_POOL_MIN:-1}
      VKO_DB_POOL_MAX: ${VKO_DB_POOL_MAX:-10}
      VKO_PROVIDER_TRANSPORT: ${VKO_PROVIDER_TRANSPORT:-internal}
      VKO_PROVIDER_WEBHOOK_URL: ${VKO_PROVIDER_WEBHOOK_URL:-}
      VKO_PROVIDER_WEBHOOK_TOKEN: ${VKO_PROVIDER_WEBHOOK_TOKEN:-}
      VKO_NOTIFICATION_TRANSPORT: ${VKO_NOTIFICATION_TRANSPORT:-internal}
      VKO_NOTIFICATION_WEBHOOK_URL: ${VKO_NOTIFICATION_WEBHOOK_URL:-}
      VKO_NOTIFICATION_WEBHOOK_TOKEN: ${VKO_NOTIFICATION_WEBHOOK_TOKEN:-}
      VKO_DATABASE_URL: postgresql://${VKO_POSTGRES_USER}:${VKO_POSTGRES_PASSWORD}@postgres:5432/${VKO_POSTGRES_DB}
      VKO_CORS_ORIGINS: ${VKO_CORS_ORIGINS:-http://127.0.0.1:8000,http://localhost:8000}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${VKO_APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)\""]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  vko_postgres_data:
