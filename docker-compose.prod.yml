services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${LINKWATCH_POSTGRES_DB:?set LINKWATCH_POSTGRES_DB}
      POSTGRES_USER: ${LINKWATCH_POSTGRES_USER:?set LINKWATCH_POSTGRES_USER}
      POSTGRES_PASSWORD: ${LINKWATCH_POSTGRES_PASSWORD:?set LINKWATCH_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${LINKWATCH_POSTGRES_PORT:-5433}:5432"
    volumes:
      - linkwatch-postgres-prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30

  linkwatch-server:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      LINKWATCH_ENV: ${LINKWATCH_ENV:-production}
      LINKWATCH_ADDR: :8080
      LINKWATCH_WEB_DIR: /app/web
      LINKWATCH_DATABASE_URL: postgres://${LINKWATCH_POSTGRES_USER}:${LINKWATCH_POSTGRES_PASSWORD}@postgres:5432/${LINKWATCH_POSTGRES_DB}
      LINKWATCH_SEED_DEMO: ${LINKWATCH_SEED_DEMO:-0}
      LINKWATCH_AUTH_DISABLED: "0"
      LINKWATCH_BOOTSTRAP_ADMIN_USERNAME: ${LINKWATCH_BOOTSTRAP_ADMIN_USERNAME:-}
      LINKWATCH_BOOTSTRAP_ADMIN_PASSWORD: ${LINKWATCH_BOOTSTRAP_ADMIN_PASSWORD:-}
      LINKWATCH_SESSION_TTL_SECONDS: ${LINKWATCH_SESSION_TTL_SECONDS:-28800}
      LINKWATCH_MAX_BACKFILL_DAYS: ${LINKWATCH_MAX_BACKFILL_DAYS:-90}
      LINKWATCH_PROVIDER_TRANSPORT: ${LINKWATCH_PROVIDER_TRANSPORT:-webhook}
      LINKWATCH_PROVIDER_WEBHOOK_URL: ${LINKWATCH_PROVIDER_WEBHOOK_URL:-}
      LINKWATCH_PROVIDER_WEBHOOK_TOKEN: ${LINKWATCH_PROVIDER_WEBHOOK_TOKEN:-}
      LINKWATCH_NOTIFICATION_TRANSPORT: ${LINKWATCH_NOTIFICATION_TRANSPORT:-webhook}
      LINKWATCH_NOTIFICATION_WEBHOOK_URL: ${LINKWATCH_NOTIFICATION_WEBHOOK_URL:-}
      LINKWATCH_NOTIFICATION_WEBHOOK_TOKEN: ${LINKWATCH_NOTIFICATION_WEBHOOK_TOKEN:-}
      LINKWATCH_CORS_ORIGINS: ${LINKWATCH_CORS_ORIGINS:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LINKWATCH_SERVER_PORT:-8000}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/ready >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  linkwatch-postgres-prod:
